<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proposal · SmartPitch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html { scroll-behavior: smooth; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .proposal-section { scroll-margin-top: 6rem; }
  </style>
</head>
<body class="min-h-screen bg-white text-slate-900">
  <header class="sticky top-0 z-10 border-b border-slate-200 bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-4xl items-center justify-between px-6 py-4">
      <span class="font-semibold tracking-tight">SmartPitch<span class="text-indigo-600">.</span></span>
      <span id="company-label" class="text-sm text-slate-500"></span>
    </div>
  </header>
  <main id="proposal-content" class="mx-auto max-w-4xl px-6 py-12 sm:py-16">
    <div id="loading" class="animate-pulse space-y-4">
      <div class="h-4 w-32 rounded bg-slate-200"></div><div class="h-10 w-2/3 rounded bg-slate-200"></div>
    </div>
    <div id="error-state" class="hidden rounded-xl border border-rose-200 bg-rose-50 p-6 text-rose-800" role="alert"></div>
    <div id="proposal" class="hidden">
      <p class="mb-3 text-sm font-semibold uppercase tracking-wider text-indigo-600">A proposal for <span id="company-name"></span></p>
      <h1 id="proposal-title" class="mb-12 text-4xl font-semibold tracking-tight sm:text-5xl"></h1>
      <div id="sections" class="space-y-5"></div>
      <footer class="mt-16 border-t border-slate-200 pt-6 text-sm text-slate-500">Prepared with SmartPitch</footer>
    </div>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    const sectionContainer = document.querySelector("#sections");
    const labels = {
      intro: "The opportunity",
      features: "What’s included",
      portfolio: "Selected work",
      pricing: "Investment"
    };

    function renderBlocks(blocks) {
      for (const block of blocks) {
        const section = document.createElement("section");
        section.id = `section-${block.id}`;
        section.dataset.blockId = block.id;
        section.className = "proposal-section rounded-2xl border border-slate-200 p-6 sm:p-8";
        const heading = document.createElement("h2");
        heading.className = "mb-4 text-xl font-semibold tracking-tight";
        heading.textContent = block.title || labels[block.id] || "Details";
        const body = document.createElement("p");
        body.className = "whitespace-pre-line leading-7 text-slate-600";
        body.textContent = block.body || "";
        section.append(heading, body);
        sectionContainer.append(section);
      }
    }

    async function loadProposal() {
      if (!token) throw new Error("This proposal link is missing its access token.");
      const response = await fetch(`/api/proposal/${encodeURIComponent(token)}`);
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "This proposal could not be found.");
      document.title = `${data.title} · SmartPitch`;
      document.querySelector("#company-label").textContent = data.company_name;
      document.querySelector("#company-name").textContent = data.company_name;
      document.querySelector("#proposal-title").textContent = data.title;
      renderBlocks(data.blocks);
      document.querySelector("#loading").classList.add("hidden");
      document.querySelector("#proposal").classList.remove("hidden");
      startSectionTracking();
    }

    function startSectionTracking() {
      const activeSections = new Map();
      const observer = new IntersectionObserver((entries) => {
        for (const entry of entries) {
          const blockId = entry.target.dataset.blockId;
          if (entry.isIntersecting && entry.intersectionRatio > 0.5) {
            if (!activeSections.has(blockId)) activeSections.set(blockId, performance.now());
          } else if (activeSections.has(blockId)) {
            flushSection(blockId);
          }
        }
      }, { threshold: [0, 0.5, 0.51, 1] });

      document.querySelectorAll(".proposal-section").forEach((section) => observer.observe(section));

      function flushSection(blockId) {
        const startedAt = activeSections.get(blockId);
        if (startedAt === undefined) return;
        activeSections.delete(blockId);
        const timeSpentMs = Math.round(performance.now() - startedAt);
        if (timeSpentMs <= 0) return;
        const payload = JSON.stringify({ token, block_id: blockId, time_spent_ms: timeSpentMs });
        const url = "/api/track";
        if (navigator.sendBeacon) {
          const queued = navigator.sendBeacon(url, new Blob([payload], { type: "application/json" }));
          if (queued) return;
        }
        fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload,
          keepalive: true
        }).catch((error) => console.error("Could not send proposal reading event.", error));
      }

      window.addEventListener("pagehide", () => {
        for (const blockId of activeSections.keys()) flushSection(blockId);
        observer.disconnect();
      });
    }

    loadProposal().catch((error) => {
      document.querySelector("#loading").classList.add("hidden");
      const errorState = document.querySelector("#error-state");
      errorState.textContent = error.message || "Unable to load this proposal.";
      errorState.classList.remove("hidden");
    });
  </script>
</body>
</html>
