<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a proposal · SmartPitch</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-6 py-4">
      <a href="/static/dashboard.html" class="text-lg font-semibold tracking-tight">SmartPitch<span class="text-indigo-600">.</span></a>
      <a href="/static/dashboard.html" class="text-sm font-medium text-slate-600 hover:text-slate-900">Back to dashboard</a>
    </div>
  </header>
  <main class="mx-auto max-w-3xl px-6 py-12">
    <div class="mb-8">
      <p class="mb-2 text-sm font-semibold uppercase tracking-wider text-indigo-600">Proposal builder</p>
      <h1 class="text-3xl font-semibold tracking-tight">Create a new proposal</h1>
      <p class="mt-2 text-slate-600">Shape your commercial offer into a polished, trackable client experience.</p>
    </div>

    <form id="proposal-form" class="space-y-6 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
      <section class="grid gap-5 sm:grid-cols-2">
        <label class="block text-sm font-medium text-slate-700">Proposal title
          <input name="title" required maxlength="200" placeholder="Website strategy & build" class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
        </label>
        <label class="block text-sm font-medium text-slate-700">Client company
          <input name="company_name" required maxlength="200" placeholder="Acme Inc." class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100">
        </label>
      </section>
      <label class="block text-sm font-medium text-slate-700">Introduction
        <textarea name="intro" required rows="4" placeholder="Set the context and describe the opportunity..." class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"></textarea>
      </label>
      <label class="block text-sm font-medium text-slate-700">What's included
        <textarea name="features" required rows="4" placeholder="One capability or deliverable per line..." class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"></textarea>
      </label>
      <label class="block text-sm font-medium text-slate-700">Selected work
        <textarea name="portfolio" required rows="4" placeholder="Relevant experience, case studies, or outcomes..." class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none transition focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"></textarea>
      </label>
      <label class="block text-sm font-medium text-slate-700">Investment & terms
        <textarea name="pricing" required rows="4" placeholder="Pricing, payment schedule, and commercial terms..." class="mt-2 w-full rounded-lg border border-slate-300 px-3 py-2.5 text-sm outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100"></textarea>
      </label>
      <div id="form-error" role="alert" class="hidden rounded-lg bg-rose-50 px-4 py-3 text-sm text-rose-700"></div>
      <div id="share-result" class="hidden rounded-xl border border-emerald-200 bg-emerald-50 p-4 text-sm text-emerald-900">
        <p class="font-semibold">Your proposal is ready to share</p>
        <div class="mt-3 flex flex-col gap-2 sm:flex-row">
          <input id="share-url" readonly class="min-w-0 flex-1 rounded-lg border border-emerald-200 bg-white px-3 py-2 text-slate-700">
          <button id="copy-link" type="button" class="rounded-lg bg-emerald-700 px-4 py-2 font-semibold text-white hover:bg-emerald-800">Copy link</button>
        </div>
      </div>
      <div class="flex justify-end border-t border-slate-100 pt-5">
        <button id="submit-button" type="submit" class="rounded-lg bg-slate-900 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-slate-700 disabled:cursor-wait disabled:opacity-60">Create proposal</button>
      </div>
    </form>
  </main>
  <script>
    const form = document.querySelector("#proposal-form");
    const errorBox = document.querySelector("#form-error");
    const resultBox = document.querySelector("#share-result");
    const submitButton = document.querySelector("#submit-button");
    const shareUrlInput = document.querySelector("#share-url");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.classList.add("hidden");
      resultBox.classList.add("hidden");
      submitButton.disabled = true;
      submitButton.textContent = "Creating…";
      const payload = Object.fromEntries(new FormData(form).entries());
      try {
        const response = await fetch("/api/proposal/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || "Could not create proposal.");
        shareUrlInput.value = new URL(data.share_url, window.location.origin).href;
        resultBox.classList.remove("hidden");
      } catch (error) {
        errorBox.textContent = error.message || "A network error prevented proposal creation.";
        errorBox.classList.remove("hidden");
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Create proposal";
      }
    });

    document.querySelector("#copy-link").addEventListener("click", async () => {
      await navigator.clipboard.writeText(shareUrlInput.value);
      document.querySelector("#copy-link").textContent = "Copied";
    });
  </script>
</body>
</html>
